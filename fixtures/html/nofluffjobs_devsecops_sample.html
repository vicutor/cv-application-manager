      "title": "GCP DevSecOps Engineer",
      "description": "<div class=\"OutlineElement Ltr SCXW70062899 BCX8\">\n<p class=\"Paragraph SCXW70062899 BCX8\" style=\"text-align: left;\"><span style=\"font-family: helvetica; font-size: 16px;\"><strong><span class=\"TextRun SCXW70062899 BCX8\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"none\"><span class=\"NormalTextRun SCXW70062899 BCX8\">At </span><span class=\"NormalTextRun SCXW70062899 BCX8\">Mindbox</span><span class=\"NormalTextRun SCXW70062899 BCX8\"> we connect top IT talents with technology projects for leading enterprises across Europe.</span></span></strong><span class=\"EOP SCXW70062899 BCX8\" data-ccp-props=\"{\"134233117\":false,\"134233118\":false,\"335559738\":240,\"335559739\":30}\"> </span></span></p>\n</div>\n<div class=\"OutlineElement Ltr SCXW70062899 BCX8\" style=\"text-align: left;\">\n<p class=\"Paragraph SCXW70062899 BCX8\"><span style=\"font-family: helvetica; font-size: 16px;\"> </span></p>\n<p><span style=\"font-family: helvetica; font-size: 16px;\">Join our client's team, where you'll play a key role in shaping the cloud security posture of a global financial institution's GCP estate. Your contribution will help deliver high-impact solutions in <strong>cloud security – Google Cloud Security & Compliance at enterprise scale, powered by cutting-edge tooling and AI-supported automation.</strong></span></p>\n<p> </p>\n<p><span style=\"font-family: helvetica; font-size: 16px;\">You'll step in as a <strong>Senior GCP DevSecOps Engineer</strong>, working within the Global Cloud Services – Google Cloud Security & Compliance team as a trusted advisor and hands-on contributor. Your role will be central to securing and maintaining compliance across a large-scale GCP environment while increasing cloud adoption and customer satisfaction – not just execution.</span></p>\n</div>\n<div class=\"OutlineElement Ltr SCXW70062899 BCX8\">\n<p class=\"Paragraph SCXW70062899 BCX8\" style=\"text-align: left;\"><span style=\"font-family: helvetica; font-size: 16px;\"><strong><span class=\"TextRun SCXW70062899 BCX8\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"none\"><span class=\"NormalTextRun SCXW70062899 BCX8\">Sounds like your kind of </span><span class=\"NormalTextRun SCXW70062899 BCX8\">challenge?</span></span><span class=\"EOP SCXW70062899 BCX8\" data-ccp-props=\"{\"134233117\":false,\"134233118\":false,\"335559738\":195,\"335559739\":195}\"> </span></strong></span></p>\n<div class=\"OutlineElement Ltr SCXW70062899 BCX8\">\n<p class=\"Paragraph SCXW70062899 BCX8\"></p>\n</div>\n</div>\nWhat you get in return\n<div class=\"ListContainerWrapper SCXW134450675 BCX8\">\n<ul class=\"BulletListStyle1 SCXW134450675 BCX8\" role=\"list\">\n<li class=\"OutlineElement Ltr SCXW134450675 BCX8\" style=\"font-family: helvetica; font-size: 16px;\" role=\"listitem\" aria-setsize=\"-1\" data-leveltext=\"\" data-font=\"Symbol\" data-listid=\"7\" data-list-defn-props=\"{\"335552541\":1,\"335559685\":720,\"335559991\":360,\"469769226\":\"Symbol\",\"469769242\":[8226],\"469777803\":\"left\",\"469777804\":\"\",\"469777815\":\"hybridMultilevel\"}\" data-aria-posinset=\"1\" data-aria-level=\"1\"><span class=\"TextRun SCXW134450675 BCX8\" lang=\"EN-US\" style=\"font-family: helvetica; font-size: 16px;\" xml:lang=\"EN-US\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW134450675 BCX8\"><strong>Flexible cooperation model</strong> – choose the form that suits you best<br>(B2B, employment contract, etc.)</span></span></li>\n<li class=\"OutlineElement Ltr SCXW134450675 BCX8\" style=\"font-family: helvetica; font-size: 16px;\" role=\"listitem\" aria-setsize=\"-1\" data-leveltext=\"\" data-font=\"Symbol\" data-listid=\"7\" data-list-defn-props=\"{\"335552541\":1,\"335559685\":720,\"335559991\":360,\"469769226\":\"Symbol\",\"469769242\":[8226],\"469777803\":\"left\",\"469777804\":\"\",\"469777815\":\"hybridMultilevel\"}\" data-aria-posinset=\"1\" data-aria-level=\"1\"><span class=\"TextRun SCXW134450675 BCX8\" lang=\"EN-US\" style=\"font-family: helvetica; font-size: 16px;\" xml:lang=\"EN-US\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW134450675 BCX8\"><strong>Hybrid work setup</strong> – <span class=\"EOP SCXW70062899 BCX8\" data-ccp-props=\"{\"134233117\":false,\"134233118\":false,\"335559738\":195,\"335559739\":195}\"> 6x/month from the office in Kraków</span></span></span></li>\n<li class=\"OutlineElement Ltr SCXW134450675 BCX8\" style=\"font-family: helvetica; font-size: 16px;\" role=\"listitem\" aria-setsize=\"-1\" data-leveltext=\"\" data-font=\"Symbol\" data-listid=\"7\" data-list-defn-props=\"{\"335552541\":1,\"335559685\":720,\"335559991\":360,\"469769226\":\"Symbol\",\"469769242\":[8226],\"469777803\":\"left\",\"469777804\":\"\",\"469777815\":\"hybridMultilevel\"}\" data-aria-posinset=\"1\" data-aria-level=\"1\"><span class=\"TextRun SCXW134450675 BCX8\" lang=\"EN-US\" style=\"font-family: helvetica; font-size: 16px;\" xml:lang=\"EN-US\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW134450675 BCX8\"><strong>Collaborative team culture</strong> – work alongside experienced professionals eager to share knowledge </span></span></li>\n<li class=\"OutlineElement Ltr SCXW134450675 BCX8\" style=\"font-family: helvetica; font-size: 16px;\" role=\"listitem\" aria-setsize=\"-1\" data-leveltext=\"\" data-font=\"Symbol\" data-listid=\"7\" data-list-defn-props=\"{\"335552541\":1,\"335559685\":720,\"335559991\":360,\"469769226\":\"Symbol\",\"469769242\":[8226],\"469777803\":\"left\",\"469777804\":\"\",\"469777815\":\"hybridMultilevel\"}\" data-aria-posinset=\"1\" data-aria-level=\"1\"><span class=\"TextRun SCXW134450675 BCX8\" lang=\"EN-US\" style=\"font-family: helvetica; font-size: 16px;\" xml:lang=\"EN-US\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW134450675 BCX8\"><strong>Continuous development</strong> – access to training platforms and growth opportunities </span></span></li>\n<li class=\"OutlineElement Ltr SCXW134450675 BCX8\" style=\"font-
