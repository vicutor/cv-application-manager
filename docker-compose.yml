services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./fixtures:/app/fixtures
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
